<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" /> <!-- Very dark slate/blue -->
      <stop offset="100%" stop-color="#030712" /> <!-- Almost black -->
    </linearGradient>
    
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glowing effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Abstract decorative elements -->
  <circle cx="1200" cy="0" r="400" fill="#6366f1" opacity="0.1" filter="url(#glow)"/>
  <circle cx="0" cy="630" r="300" fill="#a855f7" opacity="0.1" filter="url(#glow)"/>

  <!-- Logo area centered slightly higher -->
  <g transform="translate(600, 260)">
    <!-- Outer dashed pulse rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="10 10" opacity="0.3"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-dasharray="6 6" opacity="0.5"/>
    
    <!-- Core glowing center -->
    <circle cx="0" cy="0" r="90" fill="url(#primary)" filter="url(#glow)" opacity="0.2"/>
    <circle cx="0" cy="0" r="80" fill="url(#primary)"/>
    
    <!-- Inner geometric icon (a stylized 'T' or abstract book/star) -->
    <path d="M-30,-20 L30,-20 L40,0 L30,20 L-30,20 L-40,0 Z" fill="#ffffff" opacity="0.9" />
    
    <!-- Arabic letter equivalent if we wanted, or just clean minimal shapes -->
    <!-- Two small accent dots above to symbolize understanding -->
    <circle cx="-15" cy="-35" r="5" fill="#ffffff" />
    <circle cx="15" cy="-35" r="5" fill="#ffffff" />
  </g>

  <!-- Text -->
  <text x="600" y="470" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="85" fill="#ffffff" text-anchor="middle" letter-spacing="2">تبيان</text>
  
  <text x="600" y="540" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="34" fill="#cbd5e1" text-anchor="middle" letter-spacing="1">منصة ذكية لفهم الأفكار، ترتيب القرارات، واستكشاف المعنى بوضوح</text>
</svg>
