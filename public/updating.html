<!doctype html>
<!--
  صفحة «نُعيد ترتيب الصفحات» (حين يُحدَّث تبيان).

  تبيان يُستضاف على Firebase Hosting، فالتنقّل يُجاب من ملفّاتٍ ثابتة ولا يمرّ
  بخادمٍ يتبدّل. لكن إن أجابت الاستضافة نفسها تنقّلاً بخطأ 500/502/503/504،
  قدّم عاملُ الخدمة (public/sw.js) هذه الصفحة بدل صفحة Google الإنجليزية —
  والرابطُ في شريط العنوان يبقى ما طلبه الزائر، فإعادةُ التحميل تفتحه هو نفسه.

  مستقلّةٌ تماماً: لا طلبَ خارجياً، والخطُّ خطُّ تبيان (Alexandria) من الموقع
  نفسه إن كان محفوظاً وإلا خطُّ النظام. تسأل "/" كل ثلاث ثوانٍ (وتتباطأ
  تدريجياً)، فإذا أجابت أعادت فتح الصفحة المطلوبة. وإن عادت الصفحةُ تتعثّر
  والموقعُ سليم ثلاثَ مرّاتٍ في دقيقتين، تباطأت إلى مرّةٍ كل نصف دقيقة ولا تدور
  في حلقة.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121827" media="(prefers-color-scheme: dark)">
<title>نُعيد ترتيب الصفحات · تبيان</title>
<style>
/* Amiri للعنوان (خطّ العرض في تبيان: --font-serif)، وAlexandria للنص — كلاهما من /fonts في الموقع نفسه. */
@font-face{font-family:"Amiri";font-weight:400;font-display:swap;src:local("Amiri"),url("/fonts/4f1f7dad36.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:"Amiri";font-weight:700;font-display:swap;src:local("Amiri Bold"),url("/fonts/887370a1d2.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:"Alexandria";font-weight:300 700;font-display:swap;src:local("Alexandria"),url("/fonts/313baf6f04.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
:root{
  --desk:#f4efe6;--desk-2:#ebe3d4;--ink:#182231;--muted:#465568;
  --paper:#fbf8f2;--paper-edge:#e6dccb;--rule:rgb(110 91 145 / .16);
  --cover:#5f4e7f;--cover-edge:#4a3d66;--gold:#a68f58;--gold-soft:#c9b27a;--lilac:#6e5b91;--mist:#efeaf6;
  --shadow:rgb(24 34 49 / .22);--on-lilac:#fbf8f2;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --desk:#121827;--desk-2:#0c111c;--ink:#f1ece3;--muted:#b6bdcb;
    --paper:#e7dfd0;--paper-edge:#c9bea9;--rule:rgb(74 61 102 / .22);
    --cover:#3e3358;--cover-edge:#2c2441;--gold:#c9b27a;--gold-soft:#d8c494;--lilac:#b7a6d3;--mist:#231f33;
    --shadow:rgb(0 0 0 / .6);--on-lilac:#121827;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;min-height:100%;overflow-x:hidden;
  padding:max(28px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));
  display:grid;align-items:center;justify-items:center;
  background:linear-gradient(180deg,var(--desk) 0%,var(--desk) 58%,var(--desk-2) 100%);
  color:var(--ink);
  font-family:"Alexandria",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  font-synthesis:none;-webkit-font-smoothing:antialiased;
}
.folio{
  width:100%;max-width:800px;display:grid;gap:40px;align-items:center;
  grid-template-columns:minmax(0,1fr);
}
@media (min-width:760px){ .folio{grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:52px} }
/* الحواف الجانبية تحترم القطع في الوضع العرضي (الكاميرا/الأشرطة)، لا 20px ثابتة. */
body{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
/* نوافذ عريضة قصيرة (iPhone Duo مطويًا عرضيًا ~594x368، هاتف عرضي): الكتاب والحاشية
   جنبًا إلى جنب، فيبقى العنوان وزرّ «افتح الصفحة الآن» في الشاشة الأولى بدل أن يملأها الكتاب. */
@media (max-height:500px) and (min-width:540px){
  body{padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom))}
  .folio{grid-template-columns:minmax(0,clamp(190px,38vw,360px)) minmax(0,1fr);gap:28px}
  .book-wrap{width:100%;padding-bottom:10px}
  .margin{max-width:none}
  h1{font-size:clamp(26px,9vh,40px)}
  .lead{line-height:1.75}
}
/* الشاشة الداخلية لـ iPhone Duo مفتوحًا (~951x585): صفحتان متقابلتان حول
   منتصف الشاشة؛ الحاشية في الصفحة الأولى (اليمنى) والكتاب في المقابلة، ولا شيء على الكعب. */
@media screen and (min-width:721px) and (max-width:1000px) and (min-height:520px) and (max-height:960px) and (orientation:landscape){
  .folio{max-width:none;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px}
  .margin{grid-column:1;grid-row:1;justify-self:center;max-width:340px}
  .book-wrap{grid-column:2;grid-row:1;width:min(100%,360px)}
}

/* ——— الحاشية: نصٌّ إلى جانب الكتاب، كتعليقٍ في هامشه ——— */
.margin{
  position:relative;padding-inline-start:22px;text-align:start;
  border-inline-start:2px solid var(--gold);
  max-width:340px;justify-self:start;
}
.margin::before{ /* علامة الحاشية: نقطة حبرٍ ذهبية على الخط */
  content:"";position:absolute;inset-inline-start:-6px;top:4px;width:10px;height:10px;border-radius:50%;
  background:var(--paper);border:2px solid var(--gold);
}
.label{margin:0 0 10px;font-size:12px;font-weight:500;color:var(--lilac);letter-spacing:0}
.label b{font-weight:600;color:var(--gold)}
h1{margin:0;font-family:"Amiri",ui-serif,Georgia,serif;font-weight:700;font-size:clamp(30px,8.4vw,40px);line-height:1.35;letter-spacing:0}
.lead{margin:10px 0 0;font-size:15.5px;line-height:1.85;color:var(--muted)}
.note{min-height:24px;margin:18px 0 0;font-family:"Amiri",ui-serif,Georgia,serif;font-size:17px;line-height:1.7;color:var(--ink);opacity:.86}
.actions{margin-top:22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
button{
  min-height:44px;padding:0 20px 0 22px;border-radius:999px;cursor:pointer;
  border:0;background:var(--lilac);color:var(--on-lilac);
  font:inherit;font-size:14px;font-weight:600;
  box-shadow:0 8px 22px -10px var(--shadow);
  transition:background-color .2s ease,transform .2s ease;
}
button:hover{background:var(--cover)}
@media (prefers-color-scheme:dark){ button:hover{background:var(--gold-soft)} }
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.hint{font-size:12.5px;color:var(--muted)}

/* ——— الكتاب المفتوح: صفحاتٌ تُقلَب على مهل ——— */
.book-wrap{justify-self:center;width:min(100%,340px);padding-bottom:26px}
@media (min-width:760px){ .book-wrap{width:100%} }
.book{
  position:relative;width:100%;aspect-ratio:1.5/1;perspective:1400px;
  filter:drop-shadow(0 26px 30px var(--shadow));
}
.cover{position:absolute;inset:-7px -9px -9px;border-radius:9px;background:var(--cover);box-shadow:inset 0 0 0 1px var(--cover-edge)}
.cover::after{ /* خيط التجليد عند الكعب */
  content:"";position:absolute;top:-1px;bottom:-1px;left:calc(50% - 5px);width:10px;
  background:linear-gradient(90deg,transparent,var(--cover-edge),transparent);
}
.page{
  position:absolute;top:0;bottom:0;width:50%;background:var(--paper);
}
.page.right{right:0;border-radius:2px 5px 5px 2px;box-shadow:inset 14px 0 18px -14px var(--shadow),inset 0 0 0 1px var(--paper-edge)}
.page.left{left:0;border-radius:5px 2px 2px 5px;box-shadow:inset -14px 0 18px -14px var(--shadow),inset 0 0 0 1px var(--paper-edge)}
/* علامة تبيان (icon.svg) زخرفةً في رأس الصفحة اليمنى، كخاتم مكتبة. */
.exlibris{position:absolute;top:14%;left:50%;width:30%;transform:translateX(-50%);display:block}
.page.right .lines{position:absolute;inset:auto 18px 18px 18px;height:40%;background:repeating-linear-gradient(180deg,transparent 0 9px,var(--rule) 9px 11px)}
.page.left .lines{position:absolute;inset:22px 18px;background:repeating-linear-gradient(180deg,transparent 0 9px,var(--rule) 9px 11px)}
.page.left .lines::after{content:"";position:absolute;inset:auto 0 0 auto;width:42%;height:11px;background:var(--paper)}

.leaf{
  position:absolute;top:0;bottom:0;left:0;width:50%;
  transform-origin:100% 50%;transform-style:preserve-3d;
  opacity:0;animation:turn 9s cubic-bezier(.55,.05,.35,1) infinite;
}
.leaf i{
  position:absolute;inset:0;border-radius:5px 2px 2px 5px;backface-visibility:hidden;
  background:var(--paper);box-shadow:inset 0 0 0 1px var(--paper-edge);
}
.leaf i::before{content:"";position:absolute;inset:22px 18px;background:repeating-linear-gradient(180deg,transparent 0 9px,var(--rule) 9px 11px);opacity:.9}
.leaf i.front{background-image:linear-gradient(90deg,transparent 70%,rgb(24 34 49 / .07))}
.leaf i.back{transform:rotateY(180deg);background-image:linear-gradient(270deg,transparent 70%,rgb(24 34 49 / .07))}
.leaf.l1{animation-delay:-1.4s}
.leaf.l2{animation-delay:-4.4s}
.leaf.l3{animation-delay:-7.4s}
.ribbon{
  position:absolute;top:-10px;left:calc(50% + 14px);width:12px;height:calc(100% + 36px);
  background:linear-gradient(90deg,var(--gold),var(--gold-soft) 55%,var(--gold));
  clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 8px),0 100%);
  transform-origin:50% 0;animation:sway 9s ease-in-out infinite;z-index:3;
}
/* الورقة تنفصل عن الصفحة اليسرى، تعبر الكعب، ثم تستقرّ على اليمنى وتذوب فيها. */
@keyframes turn{
  0%{transform:rotateY(0);opacity:0}
  4%{transform:rotateY(0);opacity:1}
  31%{transform:rotateY(-180deg);opacity:1}
  37%,100%{transform:rotateY(-180deg);opacity:0}
}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.4deg)}}
@media (prefers-reduced-motion:reduce){
  .leaf,.ribbon{animation:none}
  .leaf{opacity:0}
  .leaf.l1{opacity:1;transform:rotateY(-24deg)}
}
</style>
</head>
<body>
<main class="folio">
  <div class="book-wrap" aria-hidden="true">
    <div class="book">
      <div class="cover"></div>
      <div class="page left"><span class="lines"></span></div>
      <div class="page right">
        <!-- علامة تبيان كما في public/icon.svg (نور في مشكاة)، بلا مربّعها. -->
        <svg class="exlibris" viewBox="96 64 320 368" focusable="false">
          <path d="M148 408 V244 C148 164 200 112 256 84 C312 112 364 164 364 244 V408" fill="none" stroke="#8E7AAE" stroke-width="26" stroke-linecap="round"/>
          <path d="M118 408 H394" fill="none" stroke="#8E7AAE" stroke-width="26" stroke-linecap="round"/>
          <path d="M256 344 V212" fill="none" stroke="#A68F58" stroke-width="24" stroke-linecap="round"/>
          <circle cx="256" cy="164" r="28" fill="#A68F58"/>
        </svg>
        <span class="lines"></span>
      </div>
      <div class="leaf l1"><i class="front"></i><i class="back"></i></div>
      <div class="leaf l2"><i class="front"></i><i class="back"></i></div>
      <div class="leaf l3"><i class="front"></i><i class="back"></i></div>
      <span class="ribbon"></span>
    </div>
  </div>
  <section class="margin">
    <p class="label"><b>حاشية</b> · من تبيان إلى قارئه</p>
    <h1 id="title">نُعيد ترتيب الصفحات</h1>
    <p class="lead" id="lead">يُجدَّد تبيان في هذه اللحظات، فنُعيد تجليد صفحاته على مهل.</p>
    <p class="note" id="note" role="status" aria-live="polite">ويعود الكتاب مفتوحاً على صفحتك من تلقاء نفسه.</p>
    <div class="actions">
      <button type="button" id="retry">افتح الصفحة الآن</button>
      <span class="hint">إن شئتَ ألّا تنتظر</span>
    </div>
  </section>
</main>
<script>
(function () {
  /* استضافةٌ ثابتة: ما تعثّر هو تنقّلُ الصفحة نفسه، فنسأل الصفحة الأولى لا /api. */
  var PROBE = "/";
  var FIRST = 3000, CEILING = 15000, PATIENT = 30000;
  var KEY = "tebyan-updating-reloads";
  var tries = 0, timer = 0, asking = false;
  var title = document.getElementById("title");
  var lead = document.getElementById("lead");
  var note = document.getElementById("note");

  /* إعاداتُ التحميل في الدقيقتين الأخيرتين: ثلاثٌ والموقعُ سليم تعني أن الصفحة
     نفسها تتعثّر، فلا ندور في حلقة. */
  function recent() {
    try {
      var now = Date.now();
      return JSON.parse(sessionStorage.getItem(KEY) || "[]").filter(function (t) { return now - t < 120000; });
    } catch (e) { return []; }
  }
  function remember() {
    try { var list = recent(); list.push(Date.now()); sessionStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
  }
  function stuck() { return recent().length >= 3; }

  /* فُتحت هذه الصفحة باسمها مباشرة: العودة إلى البداية، لا إليها. */
  function reopen() {
    remember();
    if (location.pathname === "/updating.html") location.replace("/");
    else location.reload();
  }

  function describe() {
    if (navigator.onLine === false) {
      title.textContent = "لا اتصال بالشبكة الآن";
      lead.textContent = "الكتاب محفوظٌ بين يديك، لكنّ الطريق إلى صفحاته منقطع.";
      note.textContent = "وحين يعود الاتصال نفتحه لك من تلقاء أنفسنا.";
    } else if (stuck()) {
      title.textContent = "نُعيد ترتيب الصفحات";
      lead.textContent = "يأخذ التجليد وقتاً أطول مما اعتدنا، فاعذرنا على الأناة.";
      note.textContent = "سنعاود النظر مرّةً كل نصف دقيقة، ولك أن تفتحها الآن.";
    } else {
      title.textContent = "نُعيد ترتيب الصفحات";
      lead.textContent = "يُجدَّد تبيان في هذه اللحظات، فنُعيد تجليد صفحاته على مهل.";
      note.textContent = "ويعود الكتاب مفتوحاً على صفحتك من تلقاء نفسه.";
    }
  }

  function wait() {
    if (stuck()) return PATIENT;
    return Math.min(CEILING, Math.round(FIRST * Math.pow(1.3, Math.max(0, tries - 5))));
  }
  function later() { clearTimeout(timer); timer = setTimeout(ask, wait()); }

  function ask() {
    clearTimeout(timer);
    if (asking) return;
    if (navigator.onLine === false) { describe(); later(); return; }
    asking = true;
    tries++;
    var control = typeof AbortController === "function" ? new AbortController() : null;
    var guard = setTimeout(function () { if (control) control.abort(); }, 8000);
    fetch(PROBE, { cache: "no-store", credentials: "same-origin", signal: control ? control.signal : undefined })
      .then(function (response) { return response.ok; }, function () { return false; })
      .then(function (ok) {
        clearTimeout(guard);
        asking = false;
        if (ok) { reopen(); return; }
        describe();
        later();
      });
  }

  document.getElementById("retry").addEventListener("click", function () {
    if (location.pathname === "/updating.html") location.replace("/");
    else location.reload();
  });
  window.addEventListener("online", function () { describe(); ask(); });
  window.addEventListener("offline", describe);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) ask(); });

  describe();
  later();
})();
</script>
</body>
</html>
