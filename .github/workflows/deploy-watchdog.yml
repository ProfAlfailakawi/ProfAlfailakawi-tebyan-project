name: Deploy watchdog

# Every push to main must reach the live site. Deploys run in the deploy job
# of ci.yml; this is the outside check that the site actually moved. This compares the
# commit the live site serves (build-id.json) with main and fails loudly —
# GitHub then emails the failure.
#
# Hourly, not on push: broken deploys already fail inside ci.yml (its last
# step checks the live site); this only has to catch a deploy that never ran,
# and an hour is soon enough for that.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-watchdog
  cancel-in-progress: true

jobs:
  live-matches-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://tebyan-clean-2026.web.app
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Live site serves the latest main commit
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha + " " + .commit.committer.date')
          sha=${head%% *}; when=${head#* }
          age=$(( $(date +%s) - $(date -d "$when" +%s) ))
          if [ "$age" -lt 600 ]; then
            echo "main (${sha:0:8}) is only ${age}s old; a deploy may still be running. Skipping."
            exit 0
          fi
          live=$(curl -fsS "$SITE/build-id.json?t=$(date +%s)" | jq -r .build)
          if [ "${live##*-}" = "${sha:0:8}" ]; then
            echo "Live site is on main (${sha:0:8})."
            exit 0
          fi
          echo "::error::The live site is not on the latest main. Live build: $live, main: ${sha:0:8} ($when). Check the latest CI run's deploy job: https://github.com/$GITHUB_REPOSITORY/actions/workflows/ci.yml"
          exit 1
