name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    # Pin npm to the version the committed package-lock.json was generated with.
    # The GitHub runner image periodically bumps the npm bundled with Node 22.x,
    # and a newer npm computes a different dependency tree than the lockfile,
    # making `npm ci` fail with "Missing: <pkg> from lock file" even though the
    # dependencies never changed (CI was green on this same lockfile at run #5,
    # then broke on a later run with no dependency edits). Pinning npm makes
    # `npm ci` deterministic and immune to that runner drift.
    - name: Pin npm
      run: npm install -g npm@10.9.7

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install root dependencies
      run: npm ci

    - name: Install functions dependencies
      run: cd functions && npm ci

    - name: Run lint
      run: npm run lint

    - name: Run basic unit tests
      run: npm test

    - name: Build frontend and server
      run: npm run build
