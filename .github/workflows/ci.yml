name: فحص تبيان — قبل النشر

# الفحص ثم النشر في مكان واحد: لا يُنشر إلى الموقع الحيّ إلا ما اجتاز الفحص.
# كان النشر في Cloud Build عبر تطبيق Google Cloud Build على GitHub، والتطبيق
# نفسه يغذّي مشغّلاً قديماً في مشروع معلَّق (gen-lang-client-0579828362) لا
# يمكن إطفاؤه، فيترك على كل التزام فحصاً «Queued» إلى الأبد. النشر من هنا
# يسمح بإخراج المستودع من ذلك التطبيق نهائياً.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tebyan-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت من ملف القفل
        run: npm ci

      # فحص الأنواع كان يفشل بستة أخطاء TS2307 في 4 سبتمبر 2026، لأن
      # نسختين أحدث من SmartGateway و ClientProfilePanel كانتا في جذر
      # المستودع بدل src/components — فلم يشملهما البناء ولم تظهر
      # تحسيناتهما في الموقع. البناء كان يمرّ صامتاً؛ هذه الخطوة تمسكه.
      - name: فحص الأنواع
        run: npm run lint

      # GITHUB_SHA يُكتب في dist/build-id.json (scripts/build-stamp.mjs)،
      # فيُعرف أي التزام على الموقع الحيّ.
      - name: البناء
        run: npm run build

      # الاختبارات (node --test عبر tsx) بعد البناء: تفحص ما سيُنشر فعلاً،
      # وفشلها يمنع النشر لأن deploy يعتمد على verify. لا تحتاج أي سرّ أو شبكة.
      - name: الاختبارات
        run: npm test

      - name: حفظ البناء للنشر
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # الدخول بلا مفتاح (Workload Identity): GitHub يثبت هوية المستودع والفرع
    # لـ Google، ولا يُخزَّن أي سرّ في المستودع.
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: tebyan-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # التاريخ كاملاً لخطوة «انحراف الدالة api» في آخر هذه المهمة.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/727728541245/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deploy@tebyan-app-2026.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: النشر إلى Firebase Hosting
        run: npx -y firebase-tools@15 deploy --project=tebyan-app-2026 --only hosting --non-interactive

      # نشرٌ «ناجح» لا يراه الزوار يجب أن يفشل.
      - name: الموقع الحيّ يقدّم هذا البناء
        run: |
          want=$(jq -r .build dist/build-id.json)
          for i in $(seq 1 10); do
            got=$(curl -fsS "https://tebyan-app-2026.web.app/build-id.json?t=$(date +%s)" | jq -r .build || true)
            if [ "$got" = "$want" ]; then echo "Live: $got"; exit 0; fi
            echo "Waiting for live build ($got != $want)"; sleep 6
          done
          echo "::error::Deploy finished but the live site is not serving build $want"
          exit 1

      # الدالة api (functions/) لا تُنشر من هنا — تُنشر يدوياً فقط (npm run deploy).
      # هذه الخطوة مجانية ولا تُفشل النشر: تقارن وقت آخر نشر للدالة بآخر تعديل
      # على functions/ في main، وتنبّه إن كانت الدالة الحيّة أقدم من الكود.
      - name: انحراف الدالة api عن main (تنبيه فقط)
        continue-on-error: true
        run: |
          deployed=$(gcloud functions describe api --region=us-central1 --project=tebyan-app-2026 --format='value(updateTime)' 2>/dev/null || true)
          if [ -z "$deployed" ]; then
            echo "::warning title=Function drift not checked::Could not read the last deploy time of Cloud Function api (github-deploy@ needs cloudfunctions.functions.get)."
            exit 0
          fi
          changed=$(git log --since="$deployed" --format='%h %cs %s' -- functions/)
          if [ -z "$changed" ]; then
            echo "Cloud Function api is current with functions/ (last deployed $deployed)."
            exit 0
          fi
          echo "::warning title=Cloud Function api is behind main::functions/ changed after the last function deploy ($deployed). Hosting was deployed; the function was not. Deploy it manually: firebase deploy --project=tebyan-app-2026 --only functions:api"
          {
            echo "### Cloud Function \`api\` is behind main"
            echo "Last function deploy: \`$deployed\`. Commits touching \`functions/\` since then:"
            echo '```'
            echo "$changed"
            echo '```'
            echo "Deploy manually: \`firebase deploy --project=tebyan-app-2026 --only functions:api\`"
          } >> "$GITHUB_STEP_SUMMARY"
