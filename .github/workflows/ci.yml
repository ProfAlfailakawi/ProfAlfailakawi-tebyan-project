name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Use `npm install` rather than `npm ci`. The GitHub runner image
    # periodically bumps the npm bundled with Node, and a newer npm computes a
    # slightly different dependency tree than a lockfile generated by an older
    # npm, making the strict `npm ci` fail with "Missing: <pkg> from lock file"
    # even when no dependency changed (CI was green on this lockfile at an
    # earlier run, then broke on a later run with no edits). `npm install`
    # reconciles the lockfile against whatever npm the runner ships, so the
    # build is resilient to that drift. The lockfiles are committed and kept up
    # to date, so installs stay reproducible in practice.
    - name: Install root dependencies
      run: npm install --no-audit --no-fund

    - name: Install functions dependencies
      run: cd functions && npm install --no-audit --no-fund

    - name: Run lint
      run: npm run lint

    - name: Run basic unit tests
      run: npm test

    - name: Build frontend and server
      run: npm run build
