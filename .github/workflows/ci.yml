name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # The GitHub runner image periodically bumps the npm bundled with Node 22.x.
    # A newer npm computes a different dependency tree than the committed
    # package-lock.json and makes `npm ci` fail with "Missing: <pkg> from lock
    # file" even though no dependency changed (CI was green on this same lockfile
    # at an earlier run, then broke on a later run with no dependency edits).
    # Running the clean install through `npx npm@<pinned>` guarantees the exact
    # npm the lockfile was generated with, regardless of the runner's default —
    # deterministic and immune to that drift. Regenerate the lockfile with the
    # same pinned npm if dependencies change.
    - name: Install root dependencies
      run: npx -y npm@10.9.7 ci

    - name: Install functions dependencies
      run: cd functions && npx -y npm@10.9.7 ci

    - name: Run lint
      run: npm run lint

    - name: Run basic unit tests
      run: npm test

    - name: Build frontend and server
      run: npm run build
